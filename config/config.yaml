token_scanner:
  allowed_chain_id: solana

  min_liquidity_usd: 10000
  min_volume_h1_usd: 10000
  min_txns_h1: 100

  min_price_change_m5: -10
  max_price_change_m5: 20
  min_price_change_h1: 0
  max_price_change_h1: 200  # filtro de exaustão — tokens com h1 > 200% chegaram tarde (meow +346%, MvM +318%)

  allowed_dexes:
    - pumpswap
    - raydium
    - orca
    - meteora

  excluded_dexes:
    - pumpfun

  reject_obvious_rug_pull: true

# ============================================================
# Configuração exclusiva do KRPTO3 — Scanner Contínuo
# ============================================================
scanner_loop:
  watchlist_max_age_minutes: 30     # tokens 'novo' mais antigos que isso são expirados

jupiter:
  api_key: "SUA_API_KEY_AQUI"
  quote_url: "https://api.jup.ag/swap/v1/quote"
  token_search_url: "https://api.jup.ag/tokens/v2/search"
  sol_mint: "So11111111111111111111111111111111111111112"
  buy_amount_lamports: 10000000
  sell_amount_raw: 1000000
  slippage_bps: 100
  max_price_impact_pct: 5

jupiter_filters:
  max_top_holders_percentage: 20
  min_organic_score: 30
  min_holder_count: 300
  min_num_traders_1h: 100
  max_price_impact_pct: 5

token_monitor_buy:
  input_file: "data/token_scanner/final_monitoring_candidates.json"
  output_dir: "data/token_monitor"

  poll_interval_seconds: 5
  max_monitoring_minutes: 15
  max_monitored_tokens: 5
  shadow_monitor_minutes: 60
  backoff_on_rate_limit_seconds: 10

  decision_window_minutes: 5
  min_ticks_before_decision: 12

  momentum_entry:
    enabled: true
    min_ticks_before_decision: 3
    min_momentum_pct: 4.0
    max_pullback_from_peak_pct: 3.0
    min_liquidity_growth_pct: 0.0
    max_liquidity_drop_pct: 5.0
    health_min_score: 0.60
    min_buy_pressure: 0.52
    block_if_price_falling: true
    price_falling_window_ticks: 3

  entry:
    min_ticks_before_decision: 12
    min_pullback_pct: 2.0
    max_pullback_pct: 8.0
    max_drawdown_discard_pct: 10.0
    min_buy_pressure: 0.52
    min_volume_keep_ratio: 0.40
    breakout_margin_pct: 0.2
    health_min_score: 0.60
    health_min_volume_ratio: 0.35
    health_min_buy_pressure: 0.48
    health_max_liquidity_drop_pct: 35
    health_recent_ticks: 6
    pullback_recent_ticks: 24

position_monitor:
  enabled: true
  mode: PAPER
  input_file: "data/token_monitor/buy_signals.json"
  output_dir: "data/position_monitor"

  poll_interval_seconds: 1
  max_open_positions: 2
  backoff_on_rate_limit_seconds: 1
  staleness_threshold_pct: 2.0  # descarta se preço caiu mais de X% desde o sinal

  liquidity_exit:
    enabled: true
    drop_from_open_pct: 8.0
    drop_from_peak_pct: 12.0
    window_ticks: 2
    max_pnl_for_exit_pct: 3.0

  stop_loss_pct: 5
  breakeven_trigger_pct: 3
  breakeven_profit_pct: 1
  trailing_stop_pct: 4

  profit_lock_steps:
    - trigger_pct: 3
      lock_pct: 1
    - trigger_pct: 6
      lock_pct: 3
    - trigger_pct: 10
      lock_pct: 5

  collect_metrics:
    volume_m5: true
    liquidity_usd: true
    buy_pressure: true

  onchain_audit:
    enabled: true
    provider: pumpswap
    timeout_seconds: 15
    write_global_file: true
    candidates:
      be5_baseline:
        enabled: true
        stop_loss_pct: 5
        persist_stop_seconds: 5
        breakeven_trigger_pct: 5
        trailing_gap_pct: 12
        persist_seconds: 3
        arm_persist_seconds: 0
        hard_instant_threshold_pct: 10

    hybrid_dex_gate:
      enabled: true
      candidate_name: hybrid_dex_gate
      dex_arm_pct: 2
      onchain_stop_pct: 5
      onchain_disarm_pct: 2
      disable_after_dex_breakeven: true

abb_position:
  enabled: true
  source: onchain
  provider: pumpswap
  output_dir: "data/position_monitor_abb"
  poll_interval_seconds: 1
  timeout_seconds: 15

  stop_loss_pct: 5
  hard_instant_threshold_pct: 10
  breakeven_trigger_pct: 5
  trailing_gap_pct: 12
  profit_lock_enabled: true

  persist_stop_seconds: 5
  persist_seconds: 3
  arm_persist_seconds: 0

  adaptive_breathing_band:
    enabled: true
    candle_seconds: 3
    lookback_candles: 5
    band_fraction: 0.5
    band_min_pct: 2.0
    band_max_pct: 8.0
    trailing_persist_seconds: 3
    initial_breathing_pct:

  abb_window_seconds: 120
  abb_multiplier: 0.5
  abb_min_pct: 2.0
  abb_max_pct: 8.0
  abb_fallback: reserve_ratio

shadow_monitor:
  enabled: false
  poll_interval_seconds: 10
  max_active_tokens: 5
  backoff_on_rate_limit_seconds: 30

position_sizing:
  mode: fixed_fake_usd
  amount_usd: 10
